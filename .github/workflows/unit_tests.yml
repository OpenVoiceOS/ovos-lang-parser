# This workflow will run unit tests

name: Run Unit Tests
on:
  pull_request:
    branches:
      - dev
    paths-ignore:
      - 'ovos_lang_parser/version.py'
      - '.gitignore'
      - 'LICENSE'
      - 'CHANGELOG.md'
      - 'MANIFEST.in'
  workflow_dispatch:

jobs:
  unit_tests:
    strategy:
      max-parallel: 3
      matrix:
        python-version: [ "3.10", "3.11", "3.12" ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core repo
        run: |
          pip install -e .
      - name: Install test dependencies
        run: |
          pip install pytest pytest-timeout pytest-cov packaging
      - name: Run unittests
        run: |
          pytest --cov=ovos_lang_parser --cov-report xml test
